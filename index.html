<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🩵생강 청년부🩵</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <div class="bg-white rounded-3xl shadow-xl p-8">
      <h1 class="text-4xl font-bold text-center mb-2">🩵생강 청년부🩵</h1>
      <p class="text-center text-gray-500 mb-8">성경통독 체크 페이지</p>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
        <button onclick="selectMember('조수아')" class="member-btn">조수아</button>
        <button onclick="selectMember('조민주')" class="member-btn">조민주</button>
        <button onclick="selectMember('이태현')" class="member-btn">이태현</button>
        <button onclick="selectMember('조민서')" class="member-btn">조민서</button>
        <button onclick="selectMember('김인애')" class="member-btn">김인애</button>
        <button onclick="selectMember('홍세라')" class="member-btn">홍세라</button>
      </div>

      <div id="checkArea" class="hidden">
        <div class="bg-sky-50 rounded-2xl p-6">
          <h2 class="text-2xl font-bold mb-4 text-center" id="selectedName"></h2>

          <label class="block text-lg mb-2 font-semibold">이번주 읽은 장 수</label>
          <input id="chapterInput"
            type="number"
            placeholder="예: 35"
            class="w-full border-2 border-sky-200 rounded-xl p-4 text-lg mb-4"/>

          <button onclick="saveReading()"
            class="w-full bg-sky-400 hover:bg-sky-500 text-white text-lg font-bold py-4 rounded-2xl transition">
            저장하기
          </button>
        </div>
      </div>

      <div class="mt-10">
        <h3 class="text-2xl font-bold mb-4">📊 한눈에 보기</h3>

        <div id="summary" class="grid md:grid-cols-2 gap-4"></div>
      </div>
    </div>
  </div>

  <script>
    const members = ['조수아','조민주','이태현','조민서','김인애','홍세라'];

    let currentMember = '';

    function selectMember(name){
      currentMember = name;
      document.getElementById('checkArea').classList.remove('hidden');
      document.getElementById('selectedName').innerText = name;
    }

    function saveReading(){
      const value = Number(document.getElementById('chapterInput').value);

      if(!value){
        alert('읽은 장 수를 입력해주세요!');
        return;
      }

      localStorage.setItem(currentMember, value);
      renderSummary();

      document.getElementById('chapterInput').value = '';

      alert('저장 완료 💙');
    }

    function renderSummary(){
      const summary = document.getElementById('summary');

      summary.innerHTML = '';

      members.forEach(member => {
        const value = Number(localStorage.getItem(member) || 0);
        const percent = ((value / 1189) * 100).toFixed(1);

        summary.innerHTML += `
          <div class="bg-sky-50 rounded-2xl p-5">
            <div class="flex justify-between mb-2">
              <span class="font-bold text-lg">${member}</span>
              <span>${percent}%</span>
            </div>

            <div class="w-full bg-sky-100 rounded-full h-5 overflow-hidden">
              <div class="bg-sky-400 h-5" style="width:${percent}%"></div>
            </div>

            <p class="mt-3 text-gray-600">
              이번주 읽은 장 수: <b>${value}장</b>
            </p>
          </div>
        `;
      });
    }

    renderSummary();
  </script>

  <style>
    .member-btn{
      background:white;
      border-radius:20px;
      padding:20px;
      font-size:20px;
      font-weight:bold;
      border:3px solid #bae6fd;
      transition:0.2s;
    }

    .member-btn:hover{
      background:#e0f2fe;
      transform:translateY(-2px);
    }
  </style>
</body>
</html>
